services:
  - type: web
    name: duelcade-game-server
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/ahmetyags/duelcade-backend
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: duelcade-postgres
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: ALLOW_LEGACY_PLAYER_IDS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://duelcade.expo.app
      - key: PUBLIC_BASE_URL
        value: https://duelcade-game-server.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_PROVIDERS
        value: email,google,facebook,github
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: duelcade-postgres
    plan: free
    region: frankfurt
    databaseName: duelcade
    user: duelcade
    ipAllowList: []
